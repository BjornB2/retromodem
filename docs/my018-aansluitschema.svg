<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" viewBox="0 0 1500 1500">
<style>text{font-family:Arial,sans-serif;fill:#173547;font-size:22px}.title{font-size:36px;font-weight:bold}.head{font-size:26px;font-weight:bold}.small{font-size:19px}.wire{fill:none;stroke:#237b91;stroke-width:4}.ground{fill:none;stroke:#7548a0;stroke-width:4}.box{fill:#fff;stroke:#b9cdd5;stroke-width:2}.res{fill:#fff;stroke:#237b91;stroke-width:3}</style>
<rect width="1500" height="1150" fill="#f3f7fa"/>
<text x="55" y="65" class="title">RetroModem · Pi 3 + Ming Yuan MY018</text>
<text x="55" y="102">Huidige aangepaste bedrading · fysieke pinnummers + BCM · 21 oktober 2026</text>
<rect x="45" y="130" width="1410" height="650" rx="18" class="box"/>
<text x="75" y="175" class="head">Raspberry Pi — 40-pins header</text>
<text x="1040" y="175" class="head">MY018-module</text>
<text x="75" y="230">Pin 1 · 3,3 V</text><path d="M420 222H1010" stroke="#cc5842" stroke-width="4"/><text x="1040" y="230">VCC</text>
<text x="75" y="285">Pin 8 · BCM14 · TX</text><path d="M420 277H1010" class="wire"/><text x="1040" y="285">TXD *</text>
<text x="75" y="340">Pin 10 · BCM15 · RX</text><path d="M420 332H1010" class="wire"/><text x="1040" y="340">RXD *</text>
<text x="75" y="410">Pin 11 · BCM17</text><path d="M420 402H570M670 402H1010" class="wire"/><rect x="570" y="389" width="100" height="26" class="res"/><text x="586" y="380" class="small">1 kΩ</text><text x="1040" y="410">A middenpad</text>
<text x="75" y="485">Pin 13 · BCM27</text><path d="M420 477H570M670 477H1010" class="wire"/><rect x="570" y="464" width="100" height="26" class="res"/><text x="586" y="455" class="small">1 kΩ</text><text x="1040" y="485">B middenpad</text>
<text x="75" y="560">Pin 15 · BCM22</text><path d="M420 552H570M670 552H1010" class="wire"/><rect x="570" y="539" width="100" height="26" class="res"/><text x="586" y="530" class="small">1 kΩ</text><text x="1040" y="560">C middenpad</text>
<text x="75" y="642">Pin 22 · BCM25</text><path d="M420 634H570M670 634H740" class="wire"/><rect x="570" y="621" width="100" height="26" class="res"/><text x="586" y="612" class="small">1 kΩ</text><text x="755" y="642">B · basis</text>
<rect x="730" y="663" width="225" height="85" rx="12" fill="#e7edf3"/><text x="752" y="696" class="head">2N3904</text><text x="752" y="726" class="small">NPN-schakelaar</text>
<text x="75" y="730">Pin 6 · Pi-GND</text><path d="M420 722H710" class="ground"/><text x="545" y="701" class="small">E · emitter</text>
<path d="M975 703H1010" class="ground"/><text x="985" y="675" class="small">C · collector</text><text x="1040" y="710">GND van het board</text>
<text x="75" y="763" class="small">* Boardlabels zijn host-georiënteerd: TX naar TXD, RX naar RXD — bij dit board niet kruisen.</text>
<rect x="45" y="800" width="690" height="205" rx="16" class="box"/>
<text x="70" y="840" class="head">Drie aparte pulldowns op de module</text>
<text x="70" y="882">A middenpad ── 10 kΩ ── board-GND</text>
<text x="70" y="925">B middenpad ── 10 kΩ ── board-GND</text>
<text x="70" y="968">C middenpad ── 10 kΩ ── board-GND</text>
<rect x="755" y="800" width="700" height="205" rx="16" class="box"/>
<text x="780" y="840" class="head">Transistor: fysieke pootvolgorde</text>
<text x="780" y="882">Platte tekstkant naar je toe, pootjes omlaag:</text>
<text x="780" y="925">links E · emitter   /   midden B · basis</text>
<text x="780" y="968">rechts C · collector — controleer jouw uitvoering.</text>
<text x="55" y="1045" font-weight="bold">Verwijder alle A/B/C-soldeerbruggen. Middenpads niet onderling verbinden.</text>
<text x="55" y="1078">Board-GND uitsluitend via de transistor naar Pi-GND; oude R6/resetdraad weg. VCC niet uit GPIO.</text>
<text x="55" y="1111" class="small">Bestaand vrijhouden: LED's BCM23/pin16 en BCM24/pin18; GND pin14/20; knop BCM16/pin36. Voeding los bij wijzigen.</text>
</svg>
